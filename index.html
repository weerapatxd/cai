<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>การแสดงขั้นตอนการแก้ปัญหา | ป.2 โรงเรียนบ้านฟ่อนวิทยา</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #4e3d4f;
  --ink-light: #7c687e;
  --pink: #ffb8d9;
  --pink-light: #ffeef6;
  --mint: #b2f5a6;
  --mint-light: #eaffe7;
  --blue: #aee7ff;
  --blue-light: #ebf8ff;
  --gold: #ffe990;
  --gold-light: #fffceb;
  --purple: #cca8ff;
  --purple-light: #f5edff;
  --orange: #ffc28d;
  --red: #ff8e8e;
  --card-bg: rgba(255, 255, 255, 0.94);
  --shadow: 0 8px 24px rgba(108, 77, 126, 0.12);
  --shadow-sm: 0 4px 12px rgba(108, 77, 126, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  color: var(--ink);
  font-family: 'Prompt', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: #fffbf7;
  background-image: linear-gradient(#a2e0f428 1px, transparent 1px), linear-gradient(90deg, #a2e0f428 1px, transparent 1px);
  background-size: 26px 26px;
  display: flex;
  flex-direction: column;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; user-select: none; }
button:focus-visible, input:focus-visible, .tile:focus-visible, .slot:focus-visible {
  outline: 4px solid #ff9f2d;
  outline-offset: 2px;
}

/* App Shell */
.shell {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 10px 14px 14px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

/* Header */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px;
  background: var(--card-bg);
  border: 2px solid #ecd8f2;
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 10px;
  flex-shrink: 0;
}
.brand {
  font-family: 'Mali', cursive;
  font-weight: 700;
  font-size: clamp(14px, 1.8vw, 19px);
  color: #4b6a4a;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.badge-student {
  padding: 6px 12px;
  border-radius: 999px;
  background: #ffffff;
  border: 2px solid #c7e9f3;
  font-size: 13px;
  font-weight: 600;
  color: #3b5f67;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 2px solid #77558a;
  border-radius: 16px;
  padding: 8px 16px;
  color: #382440;
  background: var(--gold);
  font-family: 'Prompt', sans-serif;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 0 4px 0 #b38e9d;
  transition: transform 0.12s ease, filter 0.15s, box-shadow 0.12s;
  text-decoration: none;
}
.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.05);
  box-shadow: 0 6px 0 #b38e9d;
}
.btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #b38e9d;
}
.btn.pink { background: var(--pink); }
.btn.mint { background: var(--mint); }
.btn.blue { background: var(--blue); }
.btn.white { background: #ffffff; }
.btn.purple { background: var(--purple); }
.btn.orange { background: var(--orange); }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 12px; box-shadow: 0 3px 0 #b38e9d; }
.btn.xs { padding: 3px 8px; font-size: 11px; border-radius: 9px; box-shadow: 0 2px 0 #b38e9d; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; box-shadow: 0 2px 0 #b38e9d !important; }

/* Main Card View */
.main-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.card {
  background: var(--card-bg);
  border: 3px solid #f6d4ec;
  border-radius: 26px;
  padding: clamp(14px, 2.2vw, 24px);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  position: relative;
}
.content-area {
  flex: 1;
  overflow-y: auto;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: #d6badb #f7f1f9;
}
.content-area::-webkit-scrollbar { width: 6px; }
.content-area::-webkit-scrollbar-thumb { background: #d6badb; border-radius: 10px; }

/* Headings */
h1, h2, h3, h4 {
  font-family: 'Mali', cursive;
  line-height: 1.35;
}
h1 { font-size: clamp(24px, 3.2vw, 36px); color: #49724f; text-shadow: 2px 2px #ffe5f1; text-align: center; margin-bottom: 6px; }
h2 { font-size: clamp(20px, 2.4vw, 28px); color: #537558; margin-bottom: 8px; }
h3 { font-size: clamp(16px, 1.8vw, 22px); color: #5d4669; }
.pagehead {
  text-align: center;
  margin-bottom: 12px;
  flex-shrink: 0;
}
.pagehead small {
  display: inline-block;
  background: #f4e8ff;
  color: #7d4d8e;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 999px;
  font-size: 12px;
  margin-bottom: 4px;
  border: 1px solid #dcbeed;
}
.lead {
  font-size: clamp(13px, 1.5vw, 17px);
  color: #69526e;
  text-align: center;
  margin: 2px 0 8px;
}

/* Animations */
.float-anim { display: inline-block; animation: bob 3s ease-in-out infinite; }
.star-anim { display: inline-block; animation: spin 10s linear infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Home / Menu Screen */
.home-hero { text-align: center; padding: 4px 0 10px; }
.namebox-wrapper {
  max-width: 620px;
  margin: 10px auto 14px;
  background: #fff8d6;
  padding: 12px 18px;
  border-radius: 20px;
  border: 2px dashed #dca567;
  box-shadow: 0 4px 10px rgba(186, 137, 72, 0.08);
}
.namebox-form {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  margin-top: 6px;
}
.namebox-form input {
  padding: 9px 14px;
  border: 2px solid #b692c2;
  border-radius: 14px;
  font-size: 16px;
  text-align: center;
  background: #ffffff;
  color: var(--ink);
  font-weight: 600;
}
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.menu-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  min-height: 74px;
  background: linear-gradient(135deg, #e4ffca, #c5f9ab);
  border: 3px solid #755f8b;
  border-radius: 18px;
  font-family: 'Mali', cursive;
  font-size: clamp(14px, 1.4vw, 17px);
  font-weight: 700;
  color: #392842;
  box-shadow: 0 4px 0 #ab97c7;
  text-align: left;
  transition: transform 0.12s ease, box-shadow 0.12s;
}
.menu-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 0 #ab97c7;
  filter: brightness(1.03);
}
.menu-card .n-badge {
  border-radius: 50%;
  background: white;
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  font-size: 15px;
  border: 2px solid #84689b;
  box-shadow: 0 2px 0 #bca7d4;
}

/* Info Cards Columns */
.info-columns {
  display: grid;
  gap: 12px;
  margin: 10px 0;
}
.info-columns.cols-1 { grid-template-columns: 1fr; }
.info-columns.cols-2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.info-columns.cols-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.info-card {
  padding: 14px;
  background: #fff8dc;
  border: 2px solid #f6de9c;
  border-radius: 20px;
  font-size: clamp(14px, 1.4vw, 16px);
  position: relative;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
}
.info-card:nth-child(2n) { background: #edfff4; border-color: #aae0c7; }
.info-card:nth-child(3n) { background: #edf8ff; border-color: #b7e0f8; }
.info-card:nth-child(4n) { background: #fbf0ff; border-color: #e2c0f7; }
.info-card .emoji-icon { font-size: 36px; margin-bottom: 6px; display: block; }
.info-card b { font-family: 'Mali', cursive; font-size: 17px; color: #432b4b; display: block; margin-bottom: 4px; }
.info-card p { color: #5a4b5d; line-height: 1.45; }

/* Timeline Step Bars */
.step-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 12px 0;
}
.step-pill {
  flex: 1;
  min-width: 130px;
  padding: 8px 12px;
  border-radius: 16px;
  background: #dbf6ff;
  border: 2px solid #94d9f0;
  text-align: center;
  font-family: 'Mali', cursive;
  font-size: 14px;
  font-weight: 700;
  color: #274b58;
}
.step-pill b { display: block; font-size: 22px; color: #1f6479; }

/* Multi-Video Layout & Player */
.videos-container {
  margin: 14px auto;
  max-width: 960px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.videos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 14px;
}
.video-card {
  background: #fdfbff;
  border: 2px solid #dfcef2;
  border-radius: 18px;
  padding: 8px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  align-items: stretch;
}
.video-media-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 14px;
  overflow: hidden;
  background: #1e1327;
}
.video-media-wrapper iframe,
.video-media-wrapper video {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  object-fit: contain;
}
.video-card .vid-info {
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
}
.video-card .vid-title {
  font-family: 'Mali', cursive;
  font-weight: 600;
  font-size: 13px;
  color: #634575;
}
.video-blank {
  padding: 16px;
  background: #fbf7ff;
  border: 2px dashed #bfaede;
  border-radius: 16px;
  text-align: center;
  color: #7b6290;
  font-size: 14px;
}

/* Game Elements */
.game-container {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin: 6px 0;
}
/* Page 7 Stacked Single Column */
.game-stacked {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.game-panel {
  padding: 12px;
  border-radius: 20px;
  background: #f6ecff;
  border: 2px solid #e1caf7;
  box-shadow: var(--shadow-sm);
}
.game-panel.panel-blue {
  background: #eef9ff;
  border-color: #b7e3f8;
}
.game-panel.panel-green {
  background: #f1fbe9;
  border-color: #c7ebaf;
}
.game-panel h3 {
  text-align: center;
  margin-bottom: 4px;
}
.hint-text {
  text-align: center;
  font-size: 12px;
  color: #775c82;
  margin-bottom: 8px;
}

/* Source Pool & Target Slots */
.pool-box {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  padding: 8px;
  background: #fffdf5;
  border: 2px dashed #e8be82;
  border-radius: 16px;
  min-height: 60px;
  align-items: center;
}
.pool-box.pool-empty {
  display: flex;
  justify-content: center;
  align-items: center;
  color: #4b803f;
  font-family: 'Mali', cursive;
  font-weight: 700;
  font-size: 14px;
  padding: 14px;
}
.slots-box {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  padding: 8px;
  background: #e4f7dd;
  border: 2px solid #aade9d;
  border-radius: 16px;
  margin-top: 8px;
}
.slot-target {
  border: 2px dashed #76b7be;
  background: #ffffff;
  border-radius: 14px;
  min-height: 100px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px;
  cursor: pointer;
  position: relative;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.slot-target:hover { background: #f3fcff; }
.slot-target.over { background: #fff3af; border-color: #f79d2b; border-style: solid; }
.slot-target .slot-num {
  position: absolute;
  top: 2px;
  left: 4px;
  background: #ffdf85;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
  color: #553a1a;
  border: 1px solid #d9ad48;
}
.slot-target.wordslot { min-height: 72px; }

/* Interactive Tiles */
.tile-item {
  border: 2px solid #ae8fd3;
  background: #ffffff;
  padding: 4px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  box-shadow: 0 3px 0 #ccafe3;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.15s;
  width: 100%;
}
.tile-item:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #ccafe3; }
.tile-item.selected {
  border-color: #ff7a18;
  background: #fff8cf;
  box-shadow: 0 0 0 4px #ffd987;
  transform: scale(1.03);
}
.tile-item img {
  width: 100%;
  height: 80px;
  object-fit: contain;
  border-radius: 8px;
  pointer-events: none;
}
.tile-item small {
  font-size: 11px;
  font-weight: 700;
  color: #6a497c;
}
.tile-item.tile-word {
  padding: 6px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.35;
  text-align: center;
  min-height: 54px;
  background: #ffffff;
  overflow-wrap: anywhere;
}

/* Result Feedback Area */
.result-box {
  margin: 10px 0;
  padding: 12px 16px;
  border-radius: 18px;
  text-align: center;
  font-family: 'Mali', cursive;
  font-size: 17px;
  font-weight: 700;
  animation: popIn 0.25s ease;
}
.result-box.success {
  background: #dffde0;
  border: 2px solid #92e896;
  color: #1f6723;
}
.result-box.partial {
  background: #fff8d6;
  border: 2px solid #ecd17e;
  color: #83561a;
}
.result-box.error {
  background: #fff0f0;
  border: 2px solid #ffb8b8;
  color: #a32222;
}
.result-box .score-val {
  font-size: 32px;
  color: #8c4ca0;
}
.result-box.error .score-val {
  color: #c72e2e;
}

/* Final Congratulations Screen */
.final-screen {
  text-align: center;
  padding: 10px 0;
}
.final-score-badge {
  font-family: 'Mali', cursive;
  font-size: clamp(40px, 7vw, 72px);
  font-weight: 700;
  color: #7b3da2;
  text-shadow: 3px 3px #ffe3f2;
  margin: 6px 0;
}

/* Actions Footer */
.actions-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

/* Footer info */
.page-footer {
  text-align: center;
  font-size: 11px;
  color: var(--ink-light);
  margin-top: 8px;
  flex-shrink: 0;
}

/* Toast Notifications */
.toast-msg {
  position: fixed;
  bottom: 18px;
  right: 18px;
  background: #4a3454;
  color: #ffffff;
  border-radius: 16px;
  padding: 10px 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  font-size: 14px;
  font-weight: 600;
  z-index: 1000;
  animation: popIn 0.2s ease;
  max-width: 90vw;
}

/* Password Lock Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(45, 27, 56, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 16px;
}
.modal-card {
  background: #ffffff;
  border: 3px solid #dca4f2;
  border-radius: 26px;
  padding: 22px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 16px 36px rgba(58, 22, 79, 0.3);
  text-align: center;
  animation: popIn 0.25s ease;
}
.modal-card.shake { animation: shake 0.4s ease; }
.pin-input {
  letter-spacing: 8px;
  font-size: 28px;
  text-align: center;
  padding: 10px;
  border: 2px solid #a881bc;
  border-radius: 14px;
  width: 100%;
  margin: 12px 0;
  font-weight: 700;
}
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0;
}
.key-btn {
  padding: 12px;
  font-size: 20px;
  font-weight: 700;
  border-radius: 14px;
  border: 2px solid #cdb2dd;
  background: #faf4ff;
  color: #4b3359;
}
.key-btn:hover { background: #ecd9ff; }

/* Admin Panel Styling */
.admin-shell {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.admin-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  border-bottom: 2px solid #ecd5f7;
  padding-bottom: 8px;
  margin-bottom: 8px;
}
.tab-btn {
  padding: 7px 14px;
  border-radius: 12px;
  border: 2px solid #c7a1db;
  background: #fdf9ff;
  font-weight: 700;
  font-size: 13px;
  color: #573766;
}
.tab-btn.active {
  background: var(--purple);
  color: #ffffff;
  border-color: #6a3a85;
}
.admin-section {
  background: #ffffff;
  border: 2px solid #ecd2f7;
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 12px;
}
.form-group {
  margin-bottom: 10px;
}
.form-group label {
  display: block;
  font-weight: 700;
  font-size: 13px;
  color: #553e61;
  margin-bottom: 4px;
}
.form-control {
  width: 100%;
  padding: 8px 12px;
  border: 2px solid #c9b1dc;
  border-radius: 12px;
  font-size: 14px;
}
.admin-grid-imgs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}
.img-admin-card {
  border: 2px solid #e2cbef;
  border-radius: 14px;
  padding: 10px;
  text-align: center;
  background: #faf6ff;
}
.img-admin-card img {
  height: 90px;
  max-width: 100%;
  object-fit: contain;
  background: #ffffff;
  border-radius: 8px;
  padding: 4px;
  border: 1px solid #dcc5eb;
  margin: 6px 0;
}

/* Video Management Items in Admin */
.admin-vid-item {
  background: #fbf7ff;
  border: 2px solid #e1cefa;
  border-radius: 14px;
  padding: 10px;
  margin-bottom: 10px;
}
.admin-vid-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.vid-type-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: #ebdbff;
  color: #59317b;
}

/* Answer Reorder Grid */
.reorder-list {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 10px 0;
}
.reorder-item {
  border: 2px solid #b794db;
  background: #ffffff;
  border-radius: 12px;
  padding: 6px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.reorder-item img {
  height: 65px;
  width: 100%;
  object-fit: contain;
  border-radius: 6px;
}
.reorder-ctrls {
  display: flex;
  gap: 4px;
  width: 100%;
  justify-content: center;
}

/* Student History Table in Admin */
.student-table-wrap {
  overflow-x: auto;
  margin: 10px 0;
  border-radius: 14px;
  border: 1px solid #ebd0f5;
}
.student-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}
.student-table th {
  background: #f4e6fc;
  color: #4b2d5a;
  padding: 10px;
  font-weight: 700;
  border-bottom: 2px solid #dfbef0;
}
.student-table td {
  padding: 8px 10px;
  border-bottom: 1px solid #f4e7fa;
  color: #4c3752;
}
.student-table tr:hover {
  background: #faf4ff;
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .shell { padding: 6px 8px; }
  .top-bar { padding: 6px 10px; gap: 6px; }
  .brand { font-size: 13px; }
  .btn { padding: 6px 12px; font-size: 12px; }
  .menu-grid { grid-template-columns: 1fr; }
  .pool-box .tile-item img { height: 60px; }
  .slot-target .tile-item img { height: 55px; }
  .slot-target { min-height: 80px; }
  .namebox-form { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

// ---------------------------------------------------------
// IndexedDB for Local Video Upload Storage
// ---------------------------------------------------------
const IDB_NAME = 'p2_cai_video_db_v1';
const IDB_STORE = 'videos';

function openVideoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function saveVideoBlob(key, blob) {
  try {
    const db = await openVideoDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const store = tx.objectStore(IDB_STORE);
      store.put(blob, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = (e) => reject(e.target.error);
    });
  } catch (err) {
    console.error('saveVideoBlob error:', err);
    return false;
  }
}

async function getVideoBlob(key) {
  try {
    const db = await openVideoDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e.target.error);
    });
  } catch (err) {
    console.error('getVideoBlob error:', err);
    return null;
  }
}

async function deleteVideoBlob(key) {
  try {
    const db = await openVideoDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const store = tx.objectStore(IDB_STORE);
      store.delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = (e) => reject(e.target.error);
    });
  } catch (err) {
    console.error('deleteVideoBlob error:', err);
    return false;
  }
}

// Storage Helpers
function loadData(k, d) {
  try {
    const raw = (k === SKEY ? sessionStorage : localStorage).getItem(k);
    if (!raw) return structuredClone(d);
    const parsed = JSON.parse(raw);
    return deepMerge(structuredClone(d), parsed);
  } catch {
    return structuredClone(d);
  }
}

function deepMerge(target, source) {
  if (!source) return target;
  for (const key of Object.keys(source)) {
    if (Array.isArray(source[key])) {
      target[key] = structuredClone(source[key]);
    } else if (source[key] && typeof source[key] === 'object') {
      if (!target[key] || typeof target[key] !== 'object' || Array.isArray(target[key])) {
        target[key] = {};
      }
      deepMerge(target[key], source[key]);
    } else if (source[key] !== undefined) {
      target[key] = source[key];
    }
  }
  return target;
}

function getStudentsHistory() {

function syncStudentRecord() {
  if (!state.name || !state.name.trim()) return;

  const list = getStudentsHistory();
  const name = state.name.trim();
  const g6Cfg = media.gameConfig?.game6 || defaults.gameConfig.game6;
  const g7Cfg = media.gameConfig?.game7 || defaults.gameConfig.game7;

  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  const max6 = g6Cfg.maxScore || 4;
  const max7 = g7Cfg.maxScore || 8;

  // Find existing record by name or create new
  let record = list.find(r => r.name.toLowerCase() === name.toLowerCase());
  if (!record) {
    record = {
      id: 'std_' + Date.now() + '_' + Math.floor(Math.random()*1000),
      name: name,
      score6: state.scores[6] || 0,
      max6: max6,
      score7: state.scores[7] || 0,
      max7: max7,
      totalScore: (state.scores[6] || 0) + (state.scores[7] || 0),
      totalMax: max6 + max7,
      attempts6: state.attempts[6] || 0,
      attempts7: state.attempts[7] || 0,
      passed6: Boolean(state.passed[6]),
      passed7: Boolean(state.passed[7]),
      date: dateStr
    };
    list.unshift(record);
  } else {
    // Record actual current scores from this session
    record.score6 = state.scores[6] || 0;
    record.max6 = max6;
    record.score7 = state.scores[7] || 0;
    record.max7 = max7;
    record.totalScore = record.score6 + record.score7;
    record.totalMax = max6 + max7;
    record.attempts6 = state.attempts[6] || 0;
    record.attempts7 = state.attempts[7] || 0;
    record.passed6 = Boolean(state.passed[6]);
    record.passed7 = Boolean(state.passed[7]);
    record.date = dateStr;
  }

  saveStudentsHistory(list);
}

// ---------------------------------------------------------
// Smart Video Source Parser & Multi-Platform Embed Handler
// ---------------------------------------------------------
function detectVideoSource(item) {
  if (!item) return null;

  if (typeof item === 'object') {
    if (item.type === 'upload' && item.blobKey) {
      return { type: 'upload', blobKey: item.blobKey, name: item.name || 'ไฟล์วิดีโอที่อัปโหลด', title: item.title || '' };
    }
    if (item.url) return detectVideoSource(item.url);
  }

  const raw = String(item).trim();
  if (!raw) return null;

  if (raw.startsWith('upload:')) {
    const key = raw.replace('upload:', '');
    return { type: 'upload', blobKey: key, name: 'ไฟล์วิดีโอที่อัปโหลด' };
  }

  try {
    const urlObj = new URL(raw.startsWith('http://') || raw.startsWith('https://') ? raw : 'https://' + raw);
    const host = urlObj.hostname.replace(/^www\./, '').toLowerCase();

    if (host === 'youtu.be') {
      const id = urlObj.pathname.slice(1).split(/[?#]/)[0];
      if (/^[\w-]{11}$/.test(id)) {
        return {
          type: 'youtube',
          id,
          url: `https://www.youtube.com/watch?v=${id}`,
          embedUrl: `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0`
        };
      }
    }
    if (['youtube.com', 'm.youtube.com', 'youtube-nocookie.com'].includes(host)) {
      const id = urlObj.searchParams.get('v') || urlObj.pathname.match(/^\/(?:embed|shorts|v)\/([\w-]{11})/)?.[1];
      if (id && /^[\w-]{11}$/.test(id)) {
        return {
          type: 'youtube',
          id,
          url: `https://www.youtube.com/watch?v=${id}`,
          embedUrl: `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0`
        };
      }
    }

    if (host.includes('drive.google.com')) {
      const match = urlObj.pathname.match(/\/file\/d\/([-\w]{25,})/) || urlObj.searchParams.get('id');
      const driveId = typeof match === 'string' ? match : (match?.[1] || null);
      if (driveId) {
        return {
          type: 'drive',
          driveId,
          embedUrl: `https://drive.google.com/file/d/${driveId}/preview`,
          url: `https://drive.google.com/file/d/${driveId}/view`
        };
      }
    }

    if (host.includes('vimeo.com')) {
      const match = urlObj.pathname.match(/\/(\d+)/);
      if (match?.[1]) {
        return {
          type: 'vimeo',
          vimeoId: match[1],
          embedUrl: `https://player.vimeo.com/video/${match[1]}`,
          url: raw
        };
      }
    }

    if (/\.(mp4|webm|ogg|ogv|mov|m4v)(\?.*)?$/i.test(urlObj.pathname)) {
      return {
        type: 'direct',
        url: raw,
        embedUrl: raw
      };
    }

    return {
      type: 'generic',
      url: raw,
      embedUrl: raw
    };
  } catch {
    if (/\.(mp4|webm|ogg|mov)$/i.test(raw)) {
      return { type: 'direct', url: raw, embedUrl: raw };
    }
  }
  return null;
}

// Hydrate Uploaded Blob Videos into <video> tags
async function hydrateBlobVideos() {
  const videos = document.querySelectorAll('video[id^="vid_blob_"]');
  for (const vEl of videos) {
    const key = vEl.id.replace('vid_blob_', '');
    const blob = await getVideoBlob(key);
    if (blob) {
      vEl.src = URL.createObjectURL(blob);
    }
  }
}

// Game Board Builder
const gameFieldMap = { tooth: 'game6', day: 'game7img', text: 'game7txt' };

function buildBoard(type, title, colorClass = '') {
  const field = gameFieldMap[type];
  const placed = state[field] || [null, null, null, null];
  const allIds = [1, 2, 3, 4];
  const unusedIds = allIds.filter(id => !placed.includes(id));

  return `
    <div class="game-panel ${colorClass}">
      <h3>${title}</h3>
      <p class="hint-text">👉 คลิก/แตะชิ้นงานด้านบน แล้วแตะช่องลำดับด้านล่าง หรือลากวางด้วยเมาส์</p>
      
      <div class="pool-box ${unusedIds.length === 0 ? 'pool-empty' : ''}">
        ${unusedIds.length ? unusedIds.map(id => renderTile(type, id)).join('') : '<span>✨ วางครบทั้ง 4 ลำดับแล้ว 🎉</span>'}
      </div>

      <div class="slots-box">
        ${placed.map((id, idx) => `
          <div class="slot-target ${type === 'text' ? 'wordslot' : ''}" role="button" tabindex="0" aria-label="ลำดับที่ ${idx + 1}" data-type="${type}" data-pos="${idx}" onclick="putTile('${type}', ${idx})" ondragover="allowDrop(event)" ondragleave="event.currentTarget.classList.remove('over')" ondrop="dropTile(event, '${type}', ${idx})">
            <span class="slot-num">${idx + 1}</span>
            ${id ? renderTile(type, id) : `<span style="font-size: 24px; opacity: 0.5">☁️</span><small style="font-size: 11px; color: #7f9984">ช่องที่ ${idx + 1}</small>`}
          </div>
        `).join('')}
      </div>
      <p style="text-align: center; font-size: 11px; color: #7d6b84; margin-top: 4px">💡 หากต้องการนำชิ้นงานออก ให้คลิกที่ช่องนั้นเพื่อยกเลิก</p>
    </div>
  `;
}

// Game Interactions
function chooseTile(type, id) {
  selection = { type, id };
  render();
  notice(`เลือกชิ้นที่ ${id} แล้ว 👉 แตะช่องลำดับที่ต้องการวางได้เลย`);
}

function putTile(type, pos) {
  const field = gameFieldMap[type];
  if (!field) return;
  const arr = state[field];

  if (type === 'tooth') {
    delete state.result?.[6];
  } else if (type === 'day' || type === 'text') {
    delete state.result?.[7];
  }

  if (selection?.type !== type) {
    if (arr[pos] !== null) {
      arr[pos] = null;
      persistState();
      render();
    } else {
      notice('กรุณาเลือกภาพหรือข้อความด้านบนก่อนนะจ๊ะ');
    }
    return;
  }

  const id = selection.id;
  const oldPos = arr.indexOf(id);
  if (oldPos >= 0) arr[oldPos] = null;
  arr[pos] = id;
  selection = null;
  persistState();
  render();
}

function startDrag(e) {
  const el = e.target.closest('[data-type][data-id]');
  if (!el) return;
  dragData = { type: el.dataset.type, id: +el.dataset.id };
  selection = dragData;
  e.dataTransfer.setData('text/plain', JSON.stringify(dragData));
  e.dataTransfer.effectAllowed = 'move';
}

function allowDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.add('over');
}

function dropTile(e, type, pos) {
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  try {
    const d = JSON.parse(e.dataTransfer.getData('text/plain'));
    if (d.type !== type) {
      notice('วางให้ตรงหมวดภาพหรือข้อความนะจ๊ะ');
      return;
    }
    selection = d;
    putTile(type, pos);
  } catch {
    if (dragData?.type === type) {
      selection = dragData;
      putTile(type, pos);
    }
  }
}

// ---------------------------------------------------------
// Score Evaluation Logic (คะแนนตามจำนวนรูปภาพ/ข้อความที่วางถูกจริง)
// ---------------------------------------------------------
function checkAnswer(n) {
  const g6Cfg = media.gameConfig?.game6 || defaults.gameConfig.game6;
  const g7Cfg = media.gameConfig?.game7 || defaults.gameConfig.game7;

  if (n === 6) {
    if (!state.game6 || !state.game6.every(Boolean)) {
      return notice('กรุณาวางภาพให้ครบทั้ง 4 ช่องก่อนตรวจนะจ๊ะ');
    }

    state.attempts[6] = (state.attempts[6] || 0) + 1;

    // Retrieve configured answer key from Admin
    const targetAnswer = (g6Cfg.answer && g6Cfg.answer.length === 4)
      ? g6Cfg.answer
      : defaults.gameConfig.game6.answer;

    // Count correct placements per slot
    const correctCount = [0, 1, 2, 3].filter(i => Number(state.game6[i]) === Number(targetAnswer[i])).length;
    const maxScore = g6Cfg.maxScore || 4;

    // Proportional Score: e.g. if maxScore is 4, 1 pt per correct item
    const earnedScore = Math.round((correctCount / 4) * maxScore);
    state.scores[6] = earnedScore;

    const isAllOk = (correctCount === 4);
    state.passed[6] = isAllOk;

    state.result = state.result || {};
    state.result[6] = { ok: isAllOk, correctCount: correctCount, total: 4 };

    if (isAllOk) {
      notice(`🎉 ยอดเยี่ยมมาก! ตอบถูกต้องครบทั้ง 4 ภาพ ได้ ${earnedScore} คะแนน`);
    } else if (correctCount > 0) {
      notice(`👍 ถูกต้อง ${correctCount} จาก 4 ภาพ ได้ ${earnedScore} คะแนน`);
    } else {
      notice('❌ ยังไม่ตรงลำดับ ลองสังเกตแล้วจัดเรียงใหม่อีกครั้งนะ 💗');
    }

    syncStudentRecord();
  } else if (n === 7) {
    if (!state.game7img || !state.game7img.every(Boolean) || !state.game7txt || !state.game7txt.every(Boolean)) {
      return notice('กรุณาจัดวางภาพและข้อความให้ครบทุกช่องก่อนตรวจนะจ๊ะ');
    }

    state.attempts[7] = (state.attempts[7] || 0) + 1;

    // Retrieve configured answer keys from Admin
    const ansImg = (g7Cfg.answerImg && g7Cfg.answerImg.length === 4)
      ? g7Cfg.answerImg
      : defaults.gameConfig.game7.answerImg;

    const ansTxt = (g7Cfg.answerTxt && g7Cfg.answerTxt.length === 4)
      ? g7Cfg.answerTxt
      : defaults.gameConfig.game7.answerTxt;

    // Count correct items for images (4) and texts (4)
    const imgCorrect = [0, 1, 2, 3].filter(i => Number(state.game7img[i]) === Number(ansImg[i])).length;
    const txtCorrect = [0, 1, 2, 3].filter(i => Number(state.game7txt[i]) === Number(ansTxt[i])).length;
    const totalCorrect = imgCorrect + txtCorrect;

    const maxScore = g7Cfg.maxScore || 8;
    // 4 images (up to 4 pts) + 4 texts (up to 4 pts) = total 8 points (proportional if custom maxScore)
    const earnedScore = Math.round((totalCorrect / 8) * maxScore);
    state.scores[7] = earnedScore;

    const isAllOk = (imgCorrect === 4 && txtCorrect === 4);
    state.passed[7] = isAllOk;

    state.result = state.result || {};
    state.result[7] = {
      ok: isAllOk,
      imgCorrect: imgCorrect,
      txtCorrect: txtCorrect,
      correctCount: totalCorrect,
      total: 8
    };

    if (isAllOk) {
      notice(`🎉 ยอดเยี่ยมมาก! วางภาพและข้อความถูกต้องครบทั้ง 8 รายการ ได้ ${earnedScore} คะแนนเต็ม`);
    } else if (totalCorrect > 0) {
      notice(`👍 ภาพถูก ${imgCorrect}/4 (${imgCorrect} คะแนน), ข้อความถูก ${txtCorrect}/4 (${txtCorrect} คะแนน) รวมได้ ${earnedScore} คะแนน`);
    } else {
      notice('❌ ทั้งภาพและข้อความยังไม่ตรงลำดับ ลองจัดเรียงใหม่อีกครั้งนะ 💗');
    }

    syncStudentRecord();
  }

  persistState();
  render();
}

function retryGame(n) {
  if (n === 6) {
    state.game6 = [null, null, null, null];
    state.passed[6] = false;
    state.scores[6] = 0;
  } else {
    state.game7img = [null, null, null, null];
    state.game7txt = [null, null, null, null];
    state.passed[7] = false;
    state.scores[7] = 0;
  }
  state.result = state.result || {};
  delete state.result[n];
  selection = null;
  persistState();
  render();
}

function addAdminCard(p) {
  if (!media.pageLayouts) media.pageLayouts = structuredClone(defaults.pageLayouts);
  if (!media.pageLayouts[p]) media.pageLayouts[p] = structuredClone(defaults.pageLayouts[p]);
  media.pageLayouts[p].cards.push({ emoji: '⭐', title: 'หัวข้อใหม่', text: 'รายละเอียดข้อความ' });
  render();
}

function deleteAdminCard(p, idx) {
  if (media.pageLayouts?.[p]?.cards) {
    media.pageLayouts[p].cards.splice(idx, 1);
    render();
  }
}

function addAdminVideo(p) {
  if (!media.videos) media.videos = structuredClone(defaults.videos);
  if (!media.videos[p]) media.videos[p] = [];
  media.videos[p].push('');
  render();
}

async function deleteAdminVideo(p, idx) {
  if (media.videos?.[p]) {
    const item = media.videos[p][idx];
    if (typeof item === 'object' && item.blobKey) {
      await deleteVideoBlob(item.blobKey);
    } else if (typeof item === 'string' && item.startsWith('upload:')) {
      await deleteVideoBlob(item.replace('upload:', ''));
    }
    media.videos[p].splice(idx, 1);
    render();
  }
}

async function uploadVideoFile(e, p, vIdx) {
  const file = e.target.files?.[0];
  if (!file) return;

  const blobKey = `vid_p${p}_${vIdx}_${Date.now()}`;
  notice(`กำลังบันทึกไฟล์วิดีโอ: ${file.name}... ⏳`);

  const ok = await saveVideoBlob(blobKey, file);
  if (ok) {
    if (!media.videos[p]) media.videos[p] = [];
    media.videos[p][vIdx] = {
      type: 'upload',
      blobKey: blobKey,
      name: file.name
    };
    persistMedia();
    notice(`อัปโหลดไฟล์วิดีโอ ${file.name} สำเร็จ ✅`);
    render();
  } else {
    notice('❌ ไม่สามารถบันทึกไฟล์วิดีโอลงในเบราว์เซอร์ได้');
  }
}

function saveAdminPage(p) {
  if (!media.pageLayouts) media.pageLayouts = structuredClone(defaults.pageLayouts);
  if (!media.pageLayouts[p]) media.pageLayouts[p] = structuredClone(defaults.pageLayouts[p]);

  const leadEl = document.getElementById('adminLead');
  const layoutEl = document.getElementById('adminLayoutCols');
  if (leadEl) media.pageLayouts[p].lead = leadEl.value.trim();
  if (layoutEl) media.pageLayouts[p].layoutCols = layoutEl.value;

  const cards = media.pageLayouts[p].cards || [];
  cards.forEach((c, idx) => {
    const emEl = document.getElementById(`cardEmoji_${idx}`);
    const tiEl = document.getElementById(`cardTitle_${idx}`);
    const txEl = document.getElementById(`cardText_${idx}`);
    if (emEl) c.emoji = emEl.value.trim();
    if (tiEl) c.title = tiEl.value.trim();
    if (txEl) c.text = txEl.value.trim();
  });

  const vids = media.videos?.[p] || [];
  vids.forEach((item, vIdx) => {
    const vEl = document.getElementById(`adminVid_${vIdx}`);
    if (vEl) {
      const val = vEl.value.trim();
      media.videos[p][vIdx] = val;
    }
  });

  persistMedia();
  notice(`บันทึกการตั้งค่าหน้า ${p} สำเร็จ ✅`);
  render();
}

function uploadImage(e, key) {
  const file = e.target.files?.[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) return notice('กรุณาเลือกไฟล์รูปภาพเท่านั้น');
  if (file.size > 10 * 1024 * 1024) return notice('กรุณาใช้ไฟล์รูปภาพขนาดไม่เกิน 10 MB');

  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const scale = Math.min(1, 360 / img.width, 460 / img.height);
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const oldImg = media.images[key];
      media.images[key] = canvas.toDataURL('image/webp', 0.82);
      try {
        persistMedia();
        notice(`เปลี่ยนภาพ ${key} สำเร็จ ✅`);
        render();
      } catch {
        media.images[key] = oldImg;
        notice('⚠️ พื้นที่จัดเก็บเต็ม กรุณาใช้ภาพที่ขนาดเล็กลง');
      }
    };
    img.onerror = () => notice('ไม่สามารถโหลดภาพนี้ได้');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function resetSingleImage(key) {
  media.images[key] = ORIGINAL[key];
  persistMedia();
  notice(`คืนค่าภาพ ${key} เรียบร้อย`);
  render();
}

function resetAllImages() {
  if (!confirm('ต้องการคืนค่ารูปภาพทั้งหมดเป็นภาพเริ่มต้นโรงเรียนหรือไม่?')) return;

}

      <h3>👥 ข้อมูลนักเรียนทั้งหมดที่เรียน (บันทึกไม่จำกัดจำนวน)</h3>
      <p class="hint-text" style="text-align:left">ระบบจะบันทึกรายชื่อและผลคะแนนของนักเรียนทุกคนที่เข้ามาเรียนและทำกิจกรรมโดยอัตโนมัติ</p>

      <div style="display:flex; gap:10px; margin:10px 0; flex-wrap:wrap">
        <div style="flex:1; min-width:140px; background:#fbf5ff; border:2px solid #e1cbf7; border-radius:14px; padding:10px; text-align:center">
          <span style="font-size:12px; color:#68467b">จำนวนนักเรียนทั้งหมด</span>
          <div style="font-size:24px; font-weight:700; color:#5c2d76">${history.length} คน</div>
        </div>
        <div style="flex:1; min-width:140px; background:#eafff0; border:2px solid #b7f0c5; border-radius:14px; padding:10px; text-align:center">
          <span style="font-size:12px; color:#367246">นักเรียนปัจจุบัน</span>
          <div style="font-size:16px; font-weight:700; color:#276136">${esc(state.name || 'ยังไม่ได้ระบุ')}</div>
        </div>
      </div>

      <div style="display:flex; gap:8px; margin:10px 0; flex-wrap:wrap">
        <button class="btn sm mint" onclick="exportStudentsCSV()">📥 ดาวน์โหลดตารางคะแนน (Excel / CSV)</button>
        <button class="btn sm pink" onclick="clearAllStudentsHistory()">🗑️ ล้างประวัตินักเรียนทั้งหมด</button>
      </div>

      <div class="student-table-wrap">
        <table class="student-table">
          <thead>
            <tr>
              <th>ลำดับ</th>
              <th>ชื่อ - นามสกุล / ชื่อเล่น</th>
              <th>เกมที่ 1 (แปรงฟัน)</th>
              <th>เกมที่ 2 (กิจวัตร)</th>
              <th>คะแนนรวม</th>
              <th>วันที่ - เวลาที่บันทึก</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody>
            ${history.length === 0 ? `
              <tr>
                <td colspan="7" style="text-align:center; padding:18px; color:#8d7996">ยังไม่มีประวัตินักเรียนที่บันทึก</td>
              </tr>
            ` : history.map((s, idx) => `
              <tr>
                <td style="font-weight:700; text-align:center">${idx + 1}</td>
                <td><b>${esc(s.name)}</b></td>
                <td><span style="font-weight:700; color:#783b99">${s.score6}</span> / ${s.max6} ${s.passed6 ? '✅' : ''}</td>
                <td><span style="font-weight:700; color:#783b99">${s.score7}</span> / ${s.max7} ${s.passed7 ? '✅' : ''}</td>
                <td><b style="color:#2f6e2b; font-size:14px">${s.totalScore} / ${s.totalMax}</b></td>
                <td style="font-size:12px; color:#78667f">${esc(s.date || '-')}</td>
                <td>
                  <button class="btn xs pink" onclick="deleteStudentRecord('${s.id}')">ลบ</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="admin-section">
      <h3>♻️ รีเซ็ตการตั้งค่าโรงเรียน</h3>
      <p class="hint-text">คืนค่าข้อความ วิดีโอ เฉลยเกม และคะแนนทั้งหมดกลับสู่ค่าเริ่มต้นของบทเรียน</p>
      <button class="btn white sm" onclick="resetAllFactory()">⚠️ คืนค่าเริ่มต้นของบทเรียนทั้งหมด</button>
    </div>
  `;
}

function deleteStudentRecord(id) {
  const list = getStudentsHistory().filter(s => s.id !== id);
  saveStudentsHistory(list);
  notice('ลบรายชื่อนักเรียนเรียบร้อย');
  render();
}

function clearAllStudentsHistory() {
  if (!confirm('ยืนยันการล้างประวัตินักเรียนทั้งหมดหรือไม่?')) return;
  saveStudentsHistory([]);
  sessionStorage.removeItem(SKEY);
  state = {
    name: '',
    attempts: { 6: 0, 7: 0 },
    scores: { 6: 0, 7: 0 },
    passed: { 6: false, 7: false },
    game6: [null, null, null, null],
    game7img: [null, null, null, null],
    game7txt: [null, null, null, null],
    result: {}
  };
  persistState();
  notice('ล้างประวัตินักเรียนทั้งหมดเรียบร้อยแล้ว');
  render();
}

function exportStudentsCSV() {
  const list = getStudentsHistory();
  if (!list.length) return notice('ไม่มีข้อมูลนักเรียนสำหรับส่งออก');

  let csv = '\uFEFFลำดับ,ชื่อนักเรียน,คะแนนเกม1,คะแนนเต็มเกม1,คะแนนเกม2,คะแนนเต็มเกม2,คะแนนรวม,คะแนนเต็มรวม,วันที่บันทึก\n';
  list.forEach((s, idx) => {
    csv += `"${idx + 1}","${(s.name || '').replace(/"/g, '""')}","${s.score6}","${s.max6}","${s.score7}","${s.max7}","${s.totalScore}","${s.totalMax}","${s.date || ''}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `คะแนนนักเรียน_CAI_ป2_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  notice('ส่งออกไฟล์คะแนน CSV สำเร็จ ✅');
}

function resetAllFactory() {
  if (!confirm('ยืนยันการคืนค่าเริ่มต้นของโรงเรียนทั้งหมดหรือไม่? การแก้ไขทั้งหมดจะถูกลบ')) return;
  media = structuredClone(defaults);
  localStorage.removeItem(KEY);
  notice('คืนค่าเริ่มต้นของบทเรียนเรียบร้อยแล้ว');
  render();
}

// ---------------------------------------------------------
// Master Render Function
// ---------------------------------------------------------
function render() {
  persistState();
  app.dataset.view = String(page);

  if (page === 'admin') {
    app.innerHTML = admin();
  } else if (page === 1) {
    app.innerHTML = home();
  } else if (page >= 2 && page <= 4) {
    app.innerHTML = lesson(page);
  } else if (page === 5) {
    app.innerHTML = toothExamples();
  } else if (page === 6 || page === 7) {
    app.innerHTML = game(page);
  } else if (page === 8) {
    app.innerHTML = summary();
  } else if (page === 9) {
    app.innerHTML = final();
  }

  // Hydrate any uploaded blob videos asynchronously
  hydrateBlobVideos();
}

// Initialize
render();
</script>
</body>
</html>
